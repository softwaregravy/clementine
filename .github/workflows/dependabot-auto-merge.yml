name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's patch and minor updates (DEC-088). GitHub
# merges one once the required checks pass on a branch that is up to date with
# main. A major update waits for review; a code change never auto-merges.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Turn on auto-merge for a patch or minor update
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
